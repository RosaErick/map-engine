# Publica o build de arquivo único no GitHub Pages.
#
# O bundle é um `dist/index.html` autocontido (vite-plugin-singlefile + base './'),
# então ele funciona igual num subcaminho de Pages, num domínio próprio ou aberto
# direto do disco por file://. Não há assets para o Pages servir errado.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A matemática de homografia e o store são a parte que não pode ir quebrada
      # para um local de montagem. O smoke precisa de navegador e roda localmente.
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
